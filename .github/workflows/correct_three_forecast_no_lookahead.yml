name: Correct three-year forecast lookahead eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/correct_three_forecast_no_lookahead.py
      - .github/workflows/correct_three_forecast_no_lookahead.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/correct_three_forecast_no_lookahead.py
      - name: Commit corrected research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_three_forecast_no_lookahead_correction.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record corrected no-lookahead three-year forecast selection"
          git pull --rebase origin main
          git push origin HEAD:main
