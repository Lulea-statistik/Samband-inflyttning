name: Validate outmigration over long rolling history
on:
  push:
    branches: [main]
    paths:
      - scripts/validate_outmigration_long_history.py
      - .github/workflows/validate_outmigration_long_history.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/validate_outmigration_long_history.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_long_history_rolling_origin_validation.json
          git add docs/data/outmigration_long_history_rolling_origin_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate outmigration over long rolling history"
          git pull --rebase origin main
          git push origin HEAD:main
