name: Test outmigration monthly 12m feature count
on:
  push:
    branches: [main]
    paths:
      - scripts/test_outmigration_monthly_12m_feature_count.py
      - .github/workflows/test_outmigration_monthly_12m_feature_count.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python scripts/test_outmigration_monthly_12m_feature_count.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_monthly_12m_feature_count.json
          git add docs/data/outmigration_monthly_12m_feature_count_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test 12-month outmigration monthly feature count"
          git pull --rebase origin main
          git push origin HEAD:main
