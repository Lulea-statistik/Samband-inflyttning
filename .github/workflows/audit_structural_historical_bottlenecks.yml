name: Audit structural historical bottlenecks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_structural_historical_bottlenecks.py"
      - ".github/workflows/audit_structural_historical_bottlenecks.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit feature versus control historical bottlenecks
        run: python scripts/audit_structural_historical_bottlenecks.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/structural_historical_bottlenecks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record individual historical availability by structural feature"
          git pull --rebase origin main
          git push origin HEAD:main
