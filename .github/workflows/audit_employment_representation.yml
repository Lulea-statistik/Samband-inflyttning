name: Audit employment representation candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_employment_representation.py"
      - ".github/workflows/audit_employment_representation.yml"
concurrency:
  group: employment-representation-audit
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit time-safe employment representations
        run: python scripts/audit_employment_representation.py
      - name: Persist diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_employment_representation_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update employment representation audit"
          git pull --rebase origin main
          git push origin HEAD:main
