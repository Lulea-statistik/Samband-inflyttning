name: Check historical employment regression readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_employment_regression_readiness.py
      - .github/workflows/audit_employment_regression_readiness.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_employment_regression_readiness.py
      - name: Publish readiness matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/employment_retrospective_regression_readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish retrospective employment regression readiness gate"
          git pull --rebase origin main
          git push origin HEAD:main
