name: Audit SCB archived table evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_scb_wayback_vintage_evidence.py
      - .github/workflows/audit_scb_wayback_vintage_evidence.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/audit_scb_wayback_vintage_evidence.py
      - name: Commit archive audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_scb_wayback_vintage_evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SCB archived table evidence audit"
          git pull --rebase origin main
          git push origin HEAD:main
