name: Stress-test commuting challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_geographic_stress.py"
      - ".github/workflows/test_commuting_geographic_stress.yml"
concurrency:
  group: commuting-geographic-stress
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test geographic holdouts and paired uncertainty
        run: python scripts/test_commuting_geographic_stress.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_geographic_stress_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update commuting geographic stress diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
