name: Compare neutral two selection strategies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/compare_neutral_two_selection_strategies.py
      - .github/workflows/compare_neutral_two_selection_strategies.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/compare_neutral_two_selection_strategies.py
      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_two_strategy_model_selection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unrestricted versus representative neutral selection comparison"
          git pull --rebase origin main
          git push origin HEAD:main
