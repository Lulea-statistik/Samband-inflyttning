name: Classify neutral correlated candidate pairs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/classify_neutral_correlated_pairs.py
      - .github/workflows/classify_neutral_correlated_pairs.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/classify_neutral_correlated_pairs.py
      - name: Commit classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_correlated_pair_classification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record neutral correlated pair relationship classifications"
          git pull --rebase origin main
          git push origin HEAD:main
