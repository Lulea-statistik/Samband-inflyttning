name: Run neutral birth-death model selection
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scikit-learn
      - run: python scripts/run_demographic_birth_death_neutral_from_zero.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/demographic_birth_death_neutral_from_zero_nested_cv.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run neutral birth and death model selection"
          git pull --rebase origin main
          git push origin HEAD:main
