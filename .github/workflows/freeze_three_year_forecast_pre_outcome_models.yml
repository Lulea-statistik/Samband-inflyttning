name: Freeze pre-outcome 3-year forecast models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/freeze_three_year_forecast_pre_outcome_models.py
      - .github/workflows/freeze_three_year_forecast_pre_outcome_models.yml
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/freeze_three_year_forecast_pre_outcome_models.py
      - name: Commit frozen parameters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_pre_outcome_frozen_models.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze pre-outcome three-year forecast models"
          git pull --rebase origin main
          git push origin HEAD:main
