name: Score untouched 2025 outmigration outcome
on:
  workflow_dispatch:
    inputs:
      outcome_csv:
        description: Path to committed 2025 outmigration outcome CSV
        required: true
        default: docs/data/outcomes/utflyttning_2025.csv
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python scripts/score_outmigration_2025_untouched.py --outcome-csv "${{ inputs.outcome_csv }}"
      - name: Commit score
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_2025_untouched_score.json
          git add docs/data/outmigration_2025_untouched_residuals.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Score untouched 2025 outmigration outcome"
          git pull --rebase origin main
          git push origin HEAD:main
