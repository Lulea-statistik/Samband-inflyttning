name: Audit new structural variable history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fresh_structural_history.py"
      - ".github/workflows/audit_fresh_structural_history.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit fixed-history variable availability
        run: python scripts/audit_fresh_structural_history.py
      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fresh_structural_historical_coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update structural feature historical coverage"
          git pull --rebase origin main
          git push origin HEAD:main
