name: Audit neutral outmigration recurrence and ablation
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_outmigration_neutral_recurrence_ablation.py
      - .github/workflows/audit_outmigration_neutral_recurrence_ablation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/audit_outmigration_neutral_recurrence_ablation.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_neutral_recurrence_ablation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit neutral outmigration recurrence and ablation"
          git pull --rebase origin main
          git push origin HEAD:main
