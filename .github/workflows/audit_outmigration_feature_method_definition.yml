name: Certify outmigration feature method definition
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_outmigration_feature_method_definition.py
      - .github/workflows/audit_outmigration_feature_method_definition.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_outmigration_feature_method_definition.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_variable_pool_reboot.json
          git add docs/data/outmigration_feature_method_definition_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Certify outmigration feature method definition"
          git pull --rebase origin main
          git push origin HEAD:main
