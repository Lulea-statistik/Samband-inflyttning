name: Validate rates 25-29 temporal stability
on:
  push:
    branches: [main]
    paths:
      - scripts/test_short_term_rates_25_29_temporal_stability.py
      - .github/workflows/test_short_term_rates_25_29_temporal_stability.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_short_term_rates_25_29_temporal_stability.py
      - name: Commit temporal stability results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_rates_25_29_temporal_stability.json
          git add docs/data/short_term_rates_25_29_temporal_stability.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate rates 25-29 temporal stability"
          git pull --rebase origin main
          git push origin HEAD:main
