name: Audit all fair candidate histories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_all_fair_candidate_histories.py
      - .github/workflows/audit_all_fair_candidate_histories.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/audit_all_fair_candidate_histories.py
      - name: Commit coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_all_candidate_historical_coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record complete fair-candidate year coverage"
          git pull --rebase origin main
          git push origin HEAD:main
