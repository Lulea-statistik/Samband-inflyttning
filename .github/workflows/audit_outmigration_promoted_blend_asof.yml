name: Audit promoted outmigration blend source vintage
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_outmigration_promoted_blend_asof.py
      - .github/workflows/audit_outmigration_promoted_blend_asof.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_outmigration_promoted_blend_asof.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_promoted_blend_asof_source_vintage_gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit promoted outmigration blend source vintage"
          git pull --rebase origin main
          git push origin HEAD:main
