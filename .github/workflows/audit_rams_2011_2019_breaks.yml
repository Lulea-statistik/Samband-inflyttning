name: Diagnose historical RAMS method breaks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_rams_2011_2019_breaks.py
      - .github/workflows/audit_rams_2011_2019_breaks.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python scripts/audit_rams_2011_2019_breaks.py
      - name: Store findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rams_2011_2019_break_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 2011 and 2019 RAMS discontinuity diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
