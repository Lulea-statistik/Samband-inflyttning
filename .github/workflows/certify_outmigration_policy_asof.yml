name: Certify outmigration annual as-of policy
on:
  push:
    branches: [main]
    paths:
      - scripts/certify_outmigration_policy_asof.py
      - .github/workflows/certify_outmigration_policy_asof.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/certify_outmigration_policy_asof.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_variable_pool_reboot.json
          git add docs/data/outmigration_policy_based_asof_certification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Certify annual outmigration as-of policy"
          git pull --rebase origin main
          git push origin HEAD:main
