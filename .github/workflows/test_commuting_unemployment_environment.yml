name: Screen unemployment and environment candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_unemployment_environment.py"
      - ".github/workflows/test_commuting_unemployment_environment.yml"
concurrency:
  group: unemployment-environment-screen
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unemployment and environmental comparisons
        run: python scripts/test_commuting_unemployment_environment.py
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_unemployment_environment_screen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update unemployment environmental candidate screen"
          git pull --rebase origin main
          git push origin HEAD:main
