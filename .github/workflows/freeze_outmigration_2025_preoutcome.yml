name: Freeze untouched 2025 outmigration forecast
on:
  push:
    branches: [main]
    paths:
      - scripts/freeze_outmigration_2025_preoutcome.py
      - .github/workflows/freeze_outmigration_2025_preoutcome.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/freeze_outmigration_2025_preoutcome.py
      - name: Commit frozen prediction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/preoutcome_2025_outmigration/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze untouched 2025 outmigration forecast"
          git pull --rebase origin main
          git push origin HEAD:main
