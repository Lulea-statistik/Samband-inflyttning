name: Audit three-year forecast sparse core robustness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_three_forecast_sparse_core_robustness.py
      - .github/workflows/audit_three_forecast_sparse_core_robustness.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/audit_three_forecast_sparse_core_robustness.py
      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_three_forecast_sparse_core_robustness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record three-year forecast sparse-core robustness audit"
          git pull --rebase origin main
          git push origin HEAD:main
