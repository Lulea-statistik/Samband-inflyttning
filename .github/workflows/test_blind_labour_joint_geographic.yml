name: Test blind employment and unemployment jointly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_blind_labour_joint_geographic.py"
      - ".github/workflows/test_blind_labour_joint_geographic.yml"
concurrency:
  group: blind-labour-joint-geographic
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run paired employment and unemployment structural comparison
        run: python scripts/test_blind_labour_joint_geographic.py
      - name: Persist research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/blind_labour_joint_geographic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record blind labour joint geographic research"
          git pull --rebase origin main
          git push origin HEAD:main
