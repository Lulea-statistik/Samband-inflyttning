name: Compare forecast with and without monthly module
on:
  push:
    branches: [main]
    paths:
      - scripts/compare_forecast_with_without_monthly_module.py
      - .github/workflows/compare_forecast_with_without_monthly_module.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python scripts/compare_forecast_with_without_monthly_module.py
      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_forecast_with_without_monthly_module.json
          git add docs/data/short_term_forecast_with_without_monthly_module.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare forecast with and without monthly module"
          git pull --rebase origin main
          git push origin HEAD:main
