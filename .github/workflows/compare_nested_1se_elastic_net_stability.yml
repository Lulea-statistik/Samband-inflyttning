name: Compare nested 1-SE Elastic Net stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/compare_nested_1se_elastic_net_stability.py
      - .github/workflows/compare_nested_1se_elastic_net_stability.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy pandas scikit-learn

      - name: Run nested 1-SE Elastic Net stability comparison
        run: python scripts/compare_nested_1se_elastic_net_stability.py

      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_nested_1se_elastic_net_stability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record nested 1-SE Elastic Net stability comparison"
          git pull --rebase origin main
          git push origin HEAD:main
