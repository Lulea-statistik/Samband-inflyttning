name: Audit core-4 historical source extension
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_core4_history_extension_sources.py
      - .github/workflows/audit_core4_history_extension_sources.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/audit_core4_history_extension_sources.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_history_extension_source_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit core-4 historical source extension"
          git pull --rebase origin main
          git push origin HEAD:main
