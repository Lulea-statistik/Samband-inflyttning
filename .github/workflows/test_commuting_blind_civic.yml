name: Test blind civic association candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_blind_civic.py"
      - ".github/workflows/test_commuting_blind_civic.yml"
concurrency:
  group: blind-civic-test
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate civic candidates in blind structural model
        run: python scripts/test_commuting_blind_civic.py
      - name: Persist research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_blind_civic_candidate_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update blind civic candidate research"
          git pull --rebase origin main
          git push origin HEAD:main
