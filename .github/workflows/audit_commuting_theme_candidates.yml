name: Audit thematic variables for commuting challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_commuting_theme_candidates.py"
      - ".github/workflows/audit_commuting_theme_candidates.yml"
concurrency:
  group: commuting-theme-audit
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit coverage and pool membership
        run: python scripts/audit_commuting_theme_candidates.py
      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_theme_candidate_coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update thematic candidate coverage report"
          git pull --rebase origin main
          git push origin HEAD:main
