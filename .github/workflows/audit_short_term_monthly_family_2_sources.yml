name: Audit short-term monthly candidate family 2 sources
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_short_term_monthly_family_2_sources.py
      - .github/workflows/audit_short_term_monthly_family_2_sources.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_short_term_monthly_family_2_sources.py
      - name: Commit source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_monthly_candidate_family_2_source_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit short-term monthly candidate family 2 sources"
          git pull --rebase origin main
          git push origin HEAD:main
