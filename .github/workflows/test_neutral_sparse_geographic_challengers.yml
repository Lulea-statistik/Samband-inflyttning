name: Test neutral sparse geographic challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_neutral_sparse_geographic_challengers.py
      - .github/workflows/test_neutral_sparse_geographic_challengers.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/test_neutral_sparse_geographic_challengers.py
      - name: Commit exploratory results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_sparse_geographic_cv_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record sparse neutral geographic challenger test"
          git pull --rebase origin main
          git push origin HEAD:main
