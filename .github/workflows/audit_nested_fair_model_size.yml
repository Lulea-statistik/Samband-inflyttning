name: Diagnose nested fair model size
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_nested_fair_model_size.py
      - .github/workflows/audit_nested_fair_model_size.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_nested_fair_model_size.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_blind_nested_one_se_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record nested fair size boundary and stability diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
