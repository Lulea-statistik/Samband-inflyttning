name: Screen individual commuter challenger candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_isolated_theme_candidates.py"
      - ".github/workflows/test_commuting_isolated_theme_candidates.yml"
concurrency:
  group: commuting-isolated-theme-candidates
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Screen single-variable challenger effects
        run: python scripts/test_commuting_isolated_theme_candidates.py
      - name: Save screening report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_isolated_theme_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update isolated thematic candidate screening"
          git pull --rebase origin main
          git push origin HEAD:main
