name: Build migration regression report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 5 15 * *"

concurrency:
  group: migration-regression-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build SCB panel and regression
        run: python scripts/build_analysis.py
      - name: Commit generated data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update migration regression data"
          git pull --rebase origin main
          git push origin HEAD:main
