name: Neutral geographic nested variable selection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_neutral_geographic_nested_selection.py
      - .github/workflows/run_neutral_geographic_nested_selection.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scikit-learn
      - run: python scripts/run_neutral_geographic_nested_selection.py
      - name: Save CV results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_geographic_nested_selection_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unbiased geographic nested CV comparison"
          git pull --rebase origin main
          git push origin HEAD:main
