name: Test geographic-equity weighted calibration
on:
  push:
    branches: [main]
    paths:
      - scripts/test_core4_geographic_equity_weighted_calibration.py
      - .github/workflows/test_core4_geographic_equity_weighted_calibration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/test_core4_geographic_equity_weighted_calibration.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/core4_geographic_equity_weighted_calibration.json
          git add docs/data/core4_geographic_equity_weighted_calibration_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test geographic-equity weighted core4 calibration"
          git pull --rebase origin main
          git push origin HEAD:main
