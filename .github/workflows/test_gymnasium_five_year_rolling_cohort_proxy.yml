name: Test rolling graduation and five-year migration means
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_gymnasium_five_year_rolling_cohort_proxy.py"
      - ".github/workflows/test_gymnasium_five_year_rolling_cohort_proxy.yml"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test graduation lags and historical five-year migration means
        run: python scripts/test_gymnasium_five_year_rolling_cohort_proxy.py
      - name: Persist research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/gymnasium_five_year_rolling_cohort_proxy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record rolling graduation and migration mean tests"
          git pull --rebase origin main
          git push origin HEAD:main
