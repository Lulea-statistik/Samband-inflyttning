name: Test core-4 temporal challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_core4_temporal_challengers.py
      - .github/workflows/test_core4_temporal_challengers.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests
      - run: python scripts/test_core4_temporal_challengers.py
      - name: Commit temporal challenger backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_temporal_challenger_backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record core-4 temporal challenger backtest"
          git pull --rebase origin main
          git push origin HEAD:main
