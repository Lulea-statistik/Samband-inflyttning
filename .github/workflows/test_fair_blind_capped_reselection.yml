name: Stress test capped fair blind selection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_fair_blind_capped_reselection.py
      - .github/workflows/test_fair_blind_capped_reselection.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_fair_blind_capped_reselection.py
      - name: Save research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_blind_capped_reselection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record capped fair variable reselection research"
          git pull --rebase origin main
          git push origin HEAD:main
