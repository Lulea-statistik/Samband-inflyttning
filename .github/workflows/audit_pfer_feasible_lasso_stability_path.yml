name: Audit PFER-feasible Lasso stability path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_pfer_feasible_lasso_stability_path.py
      - .github/workflows/audit_pfer_feasible_lasso_stability_path.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - name: Audit PFER-feasible sparse path
        run: python scripts/audit_pfer_feasible_lasso_stability_path.py
      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_pfer_feasible_lasso_stability_path.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PFER-feasible Lasso stability path"
          git pull --rebase origin main
          git push origin HEAD:main
