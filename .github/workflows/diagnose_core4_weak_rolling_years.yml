name: Diagnose weak core-4 rolling years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_core4_weak_rolling_years.py
      - .github/workflows/diagnose_core4_weak_rolling_years.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests
      - run: python scripts/diagnose_core4_weak_rolling_years.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_weak_year_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diagnose weak rolling-origin core-4 years"
          git pull --rebase origin main
          git push origin HEAD:main
