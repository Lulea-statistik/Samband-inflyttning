name: Build SCB 2025 untouched outcome once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_scb_2025_outcome_once.yml
permissions:
  contents: write
jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python scripts/build_scb_2025_outcome.py
      - name: Commit SCB 2025 outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outcomes/2025_scb docs/data/outcomes/inflyttning_2025.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build source-audited SCB 2025 outcome"
          git pull --rebase origin main
          git push origin HEAD:main
