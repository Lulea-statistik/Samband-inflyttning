name: Validate BAS RAMS calibration across overlap years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_rams_bas_calibration_loo.py
      - .github/workflows/audit_rams_bas_calibration_loo.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_rams_bas_calibration_loo.py
      - name: Commit out-of-fit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rams_bas_calibration_loo_comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare BAS RAMS calibration methods on held-out overlap years"
          git pull --rebase origin main
          git push origin HEAD:main
