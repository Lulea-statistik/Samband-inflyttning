name: Compare housing proxies across years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_fair_housing_temporal_paired.py
      - .github/workflows/test_fair_housing_temporal_paired.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_fair_housing_temporal_paired.py
      - name: Save research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_blind_housing_temporal_paired.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record paired temporal housing comparison"
          git pull --rebase origin main
          git push origin HEAD:main
