name: Compare outmigration lag1 windows on common history
on:
  push:
    branches: [main]
    paths:
      - scripts/compare_outmigration_lag1_common_history_windows.py
      - .github/workflows/compare_outmigration_lag1_common_history_windows.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python scripts/compare_outmigration_lag1_common_history_windows.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_lag1_common_history_window_comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare lag1 outmigration windows on common history"
          git pull --rebase origin main
          git push origin HEAD:main
