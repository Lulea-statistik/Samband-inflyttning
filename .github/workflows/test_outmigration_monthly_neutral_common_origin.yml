name: Compare neutral monthly outmigration candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/test_outmigration_monthly_neutral_common_origin.py
      - .github/workflows/test_outmigration_monthly_neutral_common_origin.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python scripts/test_outmigration_monthly_neutral_common_origin.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_monthly_neutral_common_origin_comparison.json
          git add docs/data/outmigration_monthly_neutral_common_origin_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare neutral monthly outmigration candidates"
          git pull --rebase origin main
          git push origin HEAD:main
