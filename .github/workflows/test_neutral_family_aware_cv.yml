name: Test neutral family-aware CV
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_neutral_family_aware_cv.py
      - .github/workflows/test_neutral_family_aware_cv.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/test_neutral_family_aware_cv.py
      - name: Commit experimental report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_family_aware_cv_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record exploratory family-aware CV comparison"
          git pull --rebase origin main
          git push origin HEAD:main
