name: Diagnose annual-monthly outmigration calendar alignment
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_outmigration_calendar_year_integration.py
      - .github/workflows/diagnose_outmigration_calendar_year_integration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/diagnose_outmigration_calendar_year_integration.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_calendar_year_integration_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diagnose annual-monthly outmigration calendar alignment"
          git pull --rebase origin main
          git push origin HEAD:main
