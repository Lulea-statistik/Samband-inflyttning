name: Diagnose historical migration forecast errors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_historical_rams_error.py"
      - ".github/workflows/diagnose_historical_rams_error.yml"
concurrency:
  group: diagnose-historical-migration-errors
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decompose 2015-2018 migration forecast errors
        run: python scripts/diagnose_historical_rams_error.py
      - name: Commit diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_historical_error_decomposition.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update historical migration error decomposition"
          git pull --rebase origin main
          git push origin HEAD:main
