name: Cross-check SCB housing completion years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_scb_completion_tables.py
      - .github/workflows/audit_scb_completion_tables.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_scb_completion_tables.py
      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb_completed_housing_table_crosscheck.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SCB completion table year-by-year crosscheck"
          git pull --rebase origin main
          git push origin HEAD:main
