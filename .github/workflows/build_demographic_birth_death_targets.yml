name: Build SCB birth-death annual targets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python scripts/build_demographic_birth_death_targets.py
      - name: Commit targets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/demographic_birth_death_targets.csv
          git add docs/data/demographic_birth_death_targets_manifest.json
          git add docs/data/demographic_birth_query.json
          git add docs/data/demographic_death_query.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build SCB birth and death annual targets"
          git pull --rebase origin main
          git push origin HEAD:main
