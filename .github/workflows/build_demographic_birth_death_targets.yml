name: Build SCB birth-death annual targets
on:
  push:
    branches: [main]
    paths:
      - scripts/build_demographic_birth_death_targets.py
      - scripts/run_demographic_birth_death_neutral_from_zero.py
      - scripts/build_demographic_scb_candidate_features.py
      - scripts/test_demographic_compact_core_ablation.py
      - scripts/test_demographic_compact_core_windows.py
      - scripts/test_demographic_window_common_origins.py
      - scripts/build_demographic_balance_historical_diagnostic.py
      - scripts/build_demographic_balance_residual_diagnostic.py
      - scripts/test_demographic_integrated_historical_backtest.py
      - scripts/test_lulea_birth_core_diagnostic.py
      - scripts/test_lulea_birth_blend_diagnostic.py
      - scripts/test_lulea_full_component_historical_backtest.py
      - scripts/decompose_lulea_full_component_error.py
      - scripts/test_lulea_direct_net_migration.py
      - scripts/test_lulea_full_balance_direct_net_challenger.py
      - scripts/test_lulea_direct_net_full_balance_robustness.py
      - scripts/test_lulea_chained_population_level_2020_2024.py
      - scripts/test_lulea_rolling_chained_population_5y.py
      - scripts/test_lulea_chained_population_horizon_stability.py
      - .github/workflows/build_demographic_birth_death_targets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests numpy scikit-learn
      - name: Build SCB birth and death targets
        run: python scripts/build_demographic_birth_death_targets.py
      - name: Build SCB demographic candidate features
        run: python scripts/build_demographic_scb_candidate_features.py
      - name: Run neutral birth and death selection
        run: python scripts/run_demographic_birth_death_neutral_from_zero.py
      - name: Test compact birth and death cores
        run: python scripts/test_demographic_compact_core_ablation.py
      - name: Compare compact core windows
        run: python scripts/test_demographic_compact_core_windows.py
      - name: Compare demographic windows on common origins
        run: python scripts/test_demographic_window_common_origins.py
      - name: Build historical demographic balance diagnostic
        run: python scripts/build_demographic_balance_historical_diagnostic.py
      - name: Build demographic balance residual diagnostic
        run: python scripts/build_demographic_balance_residual_diagnostic.py
      - name: Run integrated demographic historical backtest
        run: python scripts/test_demographic_integrated_historical_backtest.py
      - name: Diagnose Lulea birth core bias
        run: python scripts/test_lulea_birth_core_diagnostic.py
      - name: Test Lulea birth blend
        run: python scripts/test_lulea_birth_blend_diagnostic.py
      - name: Run full Lulea component backtest
        run: python scripts/test_lulea_full_component_historical_backtest.py
      - name: Decompose Lulea full component error
        run: python scripts/decompose_lulea_full_component_error.py
      - name: Test direct Lulea net migration
        run: python scripts/test_lulea_direct_net_migration.py
      - name: Test direct net full balance challenger
        run: python scripts/test_lulea_full_balance_direct_net_challenger.py
      - name: Test direct net full balance robustness
        run: python scripts/test_lulea_direct_net_full_balance_robustness.py
      - name: Validate chained Lulea population level 2020-2024
        run: python scripts/test_lulea_chained_population_level_2020_2024.py
      - name: Validate rolling five-year Lulea population windows
        run: python scripts/test_lulea_rolling_chained_population_5y.py
      - name: Test Lulea chained population horizon stability
        run: python scripts/test_lulea_chained_population_horizon_stability.py
      - name: Commit targets and neutral model results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/demographic_birth_death_targets.csv
          git add docs/data/demographic_birth_death_targets_manifest.json
          git add docs/data/demographic_birth_query.json
          git add docs/data/demographic_death_query.json
          git add docs/data/demographic_scb_candidate_features.csv
          git add docs/data/demographic_scb_candidate_features_manifest.json
          git add docs/data/demographic_birth_death_neutral_from_zero_nested_cv.json
          git add docs/data/demographic_compact_core_ablation.json
          git add docs/data/demographic_compact_core_window_comparison.json
          git add docs/data/demographic_window_common_origin_comparison.json
          git add docs/data/demographic_balance_historical_diagnostic.json
          git add docs/data/demographic_balance_residual_diagnostic.json
          git add docs/data/demographic_integrated_historical_backtest.json
          git add docs/data/lulea_birth_core_diagnostic.json
          git add docs/data/lulea_birth_blend_diagnostic.json
          git add docs/data/lulea_full_component_historical_backtest.json
          git add docs/data/lulea_full_component_error_decomposition.json
          git add docs/data/lulea_direct_net_migration_diagnostic.json
          git add docs/data/lulea_full_balance_direct_net_challenger.json
          git add docs/data/lulea_direct_net_full_balance_robustness.json
          git add docs/data/lulea_chained_population_level_validation_2020_2024.json
          git add docs/data/lulea_rolling_chained_population_validation_5y.json
          git add docs/data/lulea_chained_population_horizon_stability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build SCB birth-death targets and neutral models"
          git pull --rebase origin main
          git push origin HEAD:main
