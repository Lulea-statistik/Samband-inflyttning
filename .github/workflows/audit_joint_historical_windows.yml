name: Audit joint historical feature windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_joint_historical_windows.py
      - .github/workflows/audit_joint_historical_windows.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_joint_historical_windows.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_joint_historical_windows.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record jointly feasible historical variable windows"
          git pull --rebase origin main
          git push origin HEAD:main
