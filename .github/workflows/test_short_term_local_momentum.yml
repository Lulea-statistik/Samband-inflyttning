name: Test short-term local momentum baselines
on:
  push:
    branches: [main]
    paths:
      - scripts/test_short_term_local_momentum.py
      - .github/workflows/test_short_term_local_momentum.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_short_term_local_momentum.py
      - name: Commit local momentum benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_monthly_local_momentum_benchmark.json
          git add docs/data/short_term_monthly_local_momentum_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test short-term local momentum baselines"
          git pull --rebase origin main
          git push origin HEAD:main
