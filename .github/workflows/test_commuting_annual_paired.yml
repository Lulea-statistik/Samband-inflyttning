name: Test annual paired commuter value
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_annual_paired.py"
      - ".github/workflows/test_commuting_annual_paired.yml"
concurrency:
  group: annual-commuter-test
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare annual models without mixing SCB methods
        run: python scripts/test_commuting_annual_paired.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_annual_paired_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update annual paired commuter robustness report"
          git pull --rebase origin main
          git push origin HEAD:main
