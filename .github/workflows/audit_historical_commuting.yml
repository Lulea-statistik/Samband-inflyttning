name: Audit historical commuting model readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_historical_commuting.py"
      - ".github/workflows/audit_historical_commuting.yml"
concurrency:
  group: historical-commuting-coverage
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy
      - run: python scripts/audit_historical_commuting.py
      - name: Commit coverage audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_historical_coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update historical commuting model coverage"
          git pull --rebase origin main
          git push origin HEAD:main
