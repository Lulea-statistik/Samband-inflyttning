name: Audit neutral 1-SE variable family stability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_neutral_1se_variable_family_stability.py
      - .github/workflows/audit_neutral_1se_variable_family_stability.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/audit_neutral_1se_variable_family_stability.py
      - name: Commit diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_1se_variable_family_stability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record neutral 1-SE variable and family selection stability"
          git pull --rebase origin main
          git push origin HEAD:main
