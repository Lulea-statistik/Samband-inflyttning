name: Compare blind structural environment variables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_blind_structure_candidates.py"
      - ".github/workflows/test_commuting_blind_structure_candidates.yml"
concurrency:
  group: blind-structural-environment
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare structural unemployment and geographic environment
        run: python scripts/test_commuting_blind_structure_candidates.py
      - name: Save structural research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_blind_structure_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update demographically blind structural candidate results"
          git pull --rebase origin main
          git push origin HEAD:main
