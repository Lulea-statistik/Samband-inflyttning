name: Test 3y-10y outmigration blends
on:
  push:
    branches: [main]
    paths:
      - scripts/test_outmigration_3y_10y_blends.py
      - .github/workflows/test_outmigration_3y_10y_blends.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python scripts/test_outmigration_3y_10y_blends.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_3y_10y_blend_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test 3y and 10y outmigration blends"
          git pull --rebase origin main
          git push origin HEAD:main
