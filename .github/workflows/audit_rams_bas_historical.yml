name: Audit RAMS BAS historical comparability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_rams_bas_historical.py"
      - ".github/workflows/audit_rams_bas_historical.yml"
concurrency:
  group: rams-bas-historical
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit overlapping regimes and historical RAMS-only forecast tests
        run: python scripts/audit_rams_bas_historical.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_rams_bas_historical_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update RAMS BAS overlap and historic test report"
          git pull --rebase origin main
          git push origin HEAD:main
