name: Test final historical bias calibration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_historical_last_calibration.py"
      - ".github/workflows/test_historical_last_calibration.yml"
concurrency:
  group: historical-last-calibration
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate rolling-origin prior-year bias correction
        run: python scripts/test_historical_last_calibration.py
      - name: Commit diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_historical_last_calibration_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update historical calibration diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
