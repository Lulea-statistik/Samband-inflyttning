name: Explore employment 2019-2023 training window
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_employment_2019_2023_window.py
      - .github/workflows/test_employment_2019_2023_window.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scikit-learn
      - run: python scripts/test_employment_2019_2023_window.py
      - name: Save research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/employment_2019_2023_fixed_window_2024.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record fixed recent five-year employment growth diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
