name: Test as-of macro seasonal baseline
on:
  push:
    branches: [main]
    paths:
      - scripts/test_short_term_macro_seasonal_asof.py
      - .github/workflows/test_short_term_macro_seasonal_asof.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_short_term_macro_seasonal_asof.py
      - name: Commit macro seasonal results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_macro_seasonal_asof_backtest.json
          git add docs/data/short_term_macro_seasonal_asof_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test as-of macro seasonal baseline"
          git pull --rebase origin main
          git push origin HEAD:main
