name: Audit RAMS BAS overlapping annual growth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_rams_bas_growth_overlap.py
      - .github/workflows/audit_rams_bas_growth_overlap.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_rams_bas_growth_overlap.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rams_bas_growth_overlap_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record overlapping RAMS BAS employment growth comparisons"
          git pull --rebase origin main
          git push origin HEAD:main
