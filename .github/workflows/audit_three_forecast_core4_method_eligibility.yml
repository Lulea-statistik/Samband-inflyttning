name: Audit forecast core method eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_three_forecast_core4_method_eligibility.py
      - .github/workflows/audit_three_forecast_core4_method_eligibility.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_three_forecast_core4_method_eligibility.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_three_forecast_core4_method_eligibility_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record forecast core method eligibility audit"
          git pull --rebase origin main
          git push origin HEAD:main
