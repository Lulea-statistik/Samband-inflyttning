name: Reconstruct and backtest core-4 history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/reconstruct_backtest_core4_history.py
      - .github/workflows/reconstruct_backtest_core4_history.yml
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests
      - run: python scripts/reconstruct_backtest_core4_history.py
      - name: Commit reconstructed backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_historical_reconstructed_backtest.json
          git add docs/data/three_year_forecast_core4_historical_reconstructed_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record reconstructed historical core-4 backtest"
          git pull --rebase origin main
          git push origin HEAD:main
