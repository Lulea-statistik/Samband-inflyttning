name: Test rates 25-29 publication lag
on:
  push:
    branches: [main]
    paths:
      - scripts/test_short_term_rates_25_29_publication_lag.py
      - .github/workflows/test_short_term_rates_25_29_publication_lag.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy scikit-learn
      - run: python scripts/test_short_term_rates_25_29_publication_lag.py
      - name: Commit publication-lag results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_monthly_rates_25_29_publication_lag.json
          git add docs/data/short_term_monthly_rates_25_29_publication_lag_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test rates 25-29 publication lag"
          git pull --rebase origin main
          git push origin HEAD:main
