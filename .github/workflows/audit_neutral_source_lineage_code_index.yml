name: Index neutral candidate source lineage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_neutral_source_lineage_code_index.py
      - .github/workflows/audit_neutral_source_lineage_code_index.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_neutral_source_lineage_code_index.py
      - name: Commit lineage index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_source_lineage_code_index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate code lineage index"
          git pull --rebase origin main
          git push origin HEAD:main
