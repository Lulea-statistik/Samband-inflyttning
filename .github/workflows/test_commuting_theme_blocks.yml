name: Test new theme blocks against commuter challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_theme_blocks.py"
      - ".github/workflows/test_commuting_theme_blocks.yml"
concurrency:
  group: commuting-theme-blocks
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare theme blocks with identical rolling-year baselines
        run: python scripts/test_commuting_theme_blocks.py
      - name: Save themed challenger comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_theme_block_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update thematic commuter challenger evaluation"
          git pull --rebase origin main
          git push origin HEAD:main
