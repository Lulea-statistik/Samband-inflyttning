name: Test fixed job-growth feature sets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_job_fixed_sets.py"
      - ".github/workflows/test_commuting_job_fixed_sets.yml"
concurrency:
  group: commuting-job-fixed-sets
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare coefficient signs with unchanged feature membership
        run: python scripts/test_commuting_job_fixed_sets.py
      - name: Save fixed-set diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_job_sign_fixed_sets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update fixed-set employment coefficient diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
