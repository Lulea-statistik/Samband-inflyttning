name: Backtest frozen core-4 rolling origin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/backtest_frozen_core4_rolling_origin.py
      - .github/workflows/backtest_frozen_core4_rolling_origin.yml
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/backtest_frozen_core4_rolling_origin.py
      - name: Commit backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_rolling_origin_backtest.json
          git add docs/data/three_year_forecast_core4_rolling_origin_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record frozen core-4 rolling-origin backtest"
          git pull --rebase origin main
          git push origin HEAD:main
