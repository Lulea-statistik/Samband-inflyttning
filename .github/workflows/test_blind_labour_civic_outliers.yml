name: Test blind labour civic outliers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_blind_labour_civic_outliers.py
      - .github/workflows/test_blind_labour_civic_outliers.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_blind_labour_civic_outliers.py
      - name: Save research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/blind_labour_civic_outlier_stress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record outlier research results"
          git pull --rebase origin main
          git push origin HEAD:main
