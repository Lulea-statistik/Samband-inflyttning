name: Test five-year blind nature history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_blind_nature_five_year_rolling.py"
      - ".github/workflows/test_blind_nature_five_year_rolling.yml"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate nine one-year forecasts on fixed five-year training
        run: python scripts/test_blind_nature_five_year_rolling.py
      - name: Persist research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/blind_nature_five_year_rolling.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record five-year fixed-window nature forecast research"
          git pull --rebase origin main
          git push origin HEAD:main
