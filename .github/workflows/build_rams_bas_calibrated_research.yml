name: Calibrate RAMS history to BAS reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_rams_bas_calibrated_research.py
      - .github/workflows/build_rams_bas_calibrated_research.yml
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/build_rams_bas_calibrated_research.py
      - name: Commit research files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rams_bas_calibrated_research.csv docs/data/rams_bas_calibration_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record conservative BAS-calibrated RAMS research history"
          git pull --rebase origin main
          git push origin HEAD:main
