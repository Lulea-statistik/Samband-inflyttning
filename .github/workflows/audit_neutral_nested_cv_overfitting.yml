name: Audit neutral selection overfitting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_neutral_nested_cv_overfitting.py
      - .github/workflows/audit_neutral_nested_cv_overfitting.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/audit_neutral_nested_cv_overfitting.py
      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_nested_cv_overfitting_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record nested CV model complexity diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
