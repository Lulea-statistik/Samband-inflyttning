name: Audit gymnasium grade-point history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_gymnasium_grade_points.py"
      - ".github/workflows/audit_gymnasium_grade_points.yml"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/audit_gymnasium_grade_points.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/gymnasium_grade_points_history_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save gymnasium research result"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
