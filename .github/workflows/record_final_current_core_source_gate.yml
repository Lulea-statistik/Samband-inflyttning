name: Record final current core source gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/record_final_current_core_source_gate.py
      - .github/workflows/record_final_current_core_source_gate.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_final_current_core_source_gate.py
      - name: Commit gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_core_source_gate_final_current_evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record final current core source gate"
          git pull --rebase origin main
          git push origin HEAD:main
