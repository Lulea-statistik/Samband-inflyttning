name: Diagnose commuter job-growth stability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_commuting_job_sign.py"
      - ".github/workflows/diagnose_commuting_job_sign.yml"
concurrency:
  group: commuting-job-sign
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose conditional sign and confounding
        run: python scripts/diagnose_commuting_job_sign.py
      - name: Save research diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_job_sign_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update job-growth sign diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
