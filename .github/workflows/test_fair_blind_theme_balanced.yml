name: Test fair thematic substitution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_fair_blind_theme_balanced.py
      - .github/workflows/test_fair_blind_theme_balanced.yml
permissions:
  contents: write
concurrency:
  group: fair-blind-theme-balanced
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_fair_blind_theme_balanced.py
      - name: Commit exploratory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_blind_theme_balanced_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record fair thematic variable substitution study"
          git pull --rebase origin main
          git push origin HEAD:main
