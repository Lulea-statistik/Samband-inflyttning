name: Test size-adjusted SKR bias
on:
  push:
    branches: [main]
    paths:
      - scripts/test_core4_skr_bias_size_adjusted.py
      - .github/workflows/test_core4_skr_bias_size_adjusted.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/test_core4_skr_bias_size_adjusted.py
      - name: Commit adjusted SKR diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_skr_bias_size_adjusted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record size-adjusted SKR bias diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
