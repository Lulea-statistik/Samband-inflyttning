name: Neutral outmigration from-zero selection
on:
  push:
    branches: [main]
    paths:
      - scripts/run_outmigration_neutral_from_zero.py
      - .github/workflows/run_outmigration_neutral_from_zero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/run_outmigration_neutral_from_zero.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_neutral_from_zero_geographic_nested_cv.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run neutral from-zero outmigration selection"
          git pull --rebase origin main
          git push origin HEAD:main
