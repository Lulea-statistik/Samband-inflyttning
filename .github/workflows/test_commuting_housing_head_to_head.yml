name: Test focused housing market candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_housing_head_to_head.py"
      - ".github/workflows/test_commuting_housing_head_to_head.yml"
concurrency:
  group: focused-housing-head-to-head
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate housing market and housing sizes
        run: python scripts/test_commuting_housing_head_to_head.py
      - name: Save focused candidate results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_housing_head_to_head.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update housing candidate head-to-head results"
          git pull --rebase origin main
          git push origin HEAD:main
