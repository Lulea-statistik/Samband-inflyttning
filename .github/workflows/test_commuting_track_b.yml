name: Compare complete model RAMS and BAS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_commuting_track_b.py"
      - ".github/workflows/test_commuting_track_b.yml"
concurrency:
  group: test-commuting-track-b
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate full model RAMS and BAS comparability
        run: python scripts/test_commuting_track_b.py
      - name: Commit paired model comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/commuting_track_b_comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update 27-variable RAMS versus BAS comparison"
          git pull --rebase origin main
          git push origin HEAD:main
