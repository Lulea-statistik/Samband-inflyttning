name: Audit thematic variable register
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_fair_variable_themes.py
      - .github/workflows/audit_fair_variable_themes.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_fair_variable_themes.py
      - name: Save thematic audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_variable_thematic_register.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record thematic candidate register"
          git pull --rebase origin main
          git push origin HEAD:main
