name: Diagnose core-4 demographic SKR north bias
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_core4_demographic_skr_north_bias.py
      - .github/workflows/diagnose_core4_demographic_skr_north_bias.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests geopandas pyogrio shapely pyproj pypdf
      - run: python scripts/diagnose_core4_demographic_skr_north_bias.py
      - name: Commit demographic/geographic bias diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_core4_demographic_skr_north_bias.json
          git add docs/data/three_year_forecast_core4_demographic_skr_north_bias_rows.csv
          git add docs/data/geographic_bias_sources/skr_kommungrupp_2023.csv
          git add docs/data/geographic_bias_sources/scb_kommun_centroids_sweref99tm.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record core4 demographic SKR north bias diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
