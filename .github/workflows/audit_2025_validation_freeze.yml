name: Audit 2025 validation freeze
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_2025_validation_freeze.py
      - .github/workflows/audit_2025_validation_freeze.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/audit_2025_validation_freeze.py
      - name: Commit readiness audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_2025_validation_readiness_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit 2025 untouched validation readiness"
          git pull --rebase origin main
          git push origin HEAD:main
