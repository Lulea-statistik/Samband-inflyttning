name: Audit theme ablation and substitutions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_fair_theme_ablation.py
      - .github/workflows/audit_fair_theme_ablation.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_fair_theme_ablation.py
      - name: Save exploratory result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair_blind_theme_ablation_replacement.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record thematic ablation and paired replacement audit"
          git pull --rebase origin main
          git push origin HEAD:main
