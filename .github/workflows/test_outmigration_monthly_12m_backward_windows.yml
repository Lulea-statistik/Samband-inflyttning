name: Compare outmigration monthly backward windows
on:
  push:
    branches: [main]
    paths:
      - scripts/test_outmigration_monthly_12m_backward_windows.py
      - .github/workflows/test_outmigration_monthly_12m_backward_windows.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python scripts/test_outmigration_monthly_12m_backward_windows.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_monthly_12m_backward_window_comparison.json
          git add docs/data/outmigration_monthly_12m_backward_window_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare outmigration monthly backward windows"
          git pull --rebase origin main
          git push origin HEAD:main
