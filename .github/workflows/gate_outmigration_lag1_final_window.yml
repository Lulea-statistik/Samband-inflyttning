name: Final gate for outmigration lag1 window
on:
  push:
    branches: [main]
    paths:
      - scripts/gate_outmigration_lag1_final_window.py
      - .github/workflows/gate_outmigration_lag1_final_window.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python scripts/gate_outmigration_lag1_final_window.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_lag1_final_window_gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gate final lag1 outmigration training window"
          git pull --rebase origin main
          git push origin HEAD:main
