name: Snapshot forecast core sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/snapshot_forecast_core_sources.py
      - name: Commit immutable source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/source_snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture dated forecast-core source snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
