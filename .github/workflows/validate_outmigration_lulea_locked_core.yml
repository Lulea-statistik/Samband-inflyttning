name: Validate locked outmigration core for Lulea
on:
  push:
    branches: [main]
    paths:
      - scripts/validate_outmigration_lulea_locked_core.py
      - .github/workflows/validate_outmigration_lulea_locked_core.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn
      - run: python scripts/validate_outmigration_lulea_locked_core.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/outmigration_lulea_locked_core_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate locked outmigration core for Lulea"
          git pull --rebase origin main
          git push origin HEAD:main
