name: Build short-term monthly candidate family 2
on:
  push:
    branches: [main]
    paths:
      - scripts/build_short_term_monthly_family_2.py
      - .github/workflows/build_short_term_monthly_family_2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_short_term_monthly_family_2.py
      - name: Commit family 2 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_monthly_candidate_family_2.csv
          git add docs/data/short_term_monthly_candidate_family_2_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build short-term monthly candidate family 2"
          git pull --rebase origin main
          git push origin HEAD:main
