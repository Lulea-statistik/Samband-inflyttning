name: Audit full-Ridge 76-feature snapshot feasibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_full_ridge_76_snapshot_feasibility.py
      - .github/workflows/audit_full_ridge_76_snapshot_feasibility.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/audit_full_ridge_76_snapshot_feasibility.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/three_year_forecast_full_ridge_76_snapshot_feasibility.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit 76-feature predictor snapshot feasibility"
          git pull --rebase origin main
          git push origin HEAD:main
