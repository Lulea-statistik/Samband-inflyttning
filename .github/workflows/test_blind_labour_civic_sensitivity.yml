name: Stress test blind labour and civic structural controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_blind_labour_civic_sensitivity.py"
      - ".github/workflows/test_blind_labour_civic_sensitivity.yml"
concurrency:
  group: blind-labour-civic-sensitivity
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare years geographic folds and structural controls
        run: python scripts/test_blind_labour_civic_sensitivity.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/blind_labour_civic_sensitivity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record blind labour civic sensitivity results"
          git pull --rebase origin main
          git push origin HEAD:main
