name: Audit Kolada N03937 publication metadata
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_kolada_n03937_publication_metadata.py
      - .github/workflows/audit_kolada_n03937_publication_metadata.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_kolada_n03937_publication_metadata.py
      - name: Commit Kolada metadata audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python scripts/audit_kolada_n03937_publication_metadata.py
          git add docs/data/kolada_n03937_publication_metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Kolada N03937 publication metadata"
          git push origin HEAD:main
