name: Test gymnasium in blind structural model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_gymnasium_blind_structural_geographic.py"
      - ".github/workflows/test_gymnasium_blind_structural_geographic.yml"
concurrency:
  group: gymnasium-blind-structural-geographic
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fair geographic blind gymnasium test
        run: python scripts/test_gymnasium_blind_structural_geographic.py
      - name: Save research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/gymnasium_blind_structural_geographic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record blind gymnasium geographic validation"
          git pull --rebase origin main
          git push origin HEAD:main
