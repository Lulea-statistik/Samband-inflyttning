name: Prepare neutral variable family review matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare_neutral_family_review_matrix.py
      - .github/workflows/prepare_neutral_family_review_matrix.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/prepare_neutral_family_review_matrix.py
      - name: Commit review matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/neutral_family_review_matrix.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish neutral candidate family review matrix"
          git pull --rebase origin main
          git push origin HEAD:main
