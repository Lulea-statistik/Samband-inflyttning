name: Validate adjusted RAMS integrity and stability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_rams_adjusted_integrity_gate.py
      - .github/workflows/audit_rams_adjusted_integrity_gate.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_rams_adjusted_integrity_gate.py
      - name: Publish gate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rams_bas_adjusted_integrity_gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record adjusted RAMS data integrity and stability gate"
          git pull --rebase origin main
          git push origin HEAD:main
