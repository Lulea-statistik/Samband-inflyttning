name: Compare 12 vs 9 month backward windows
on:
  push:
    branches: [main]
    paths:
      - docs/data/short_term_monthly_candidate_family_2.csv
      - scripts/test_short_term_rates_25_29_backward_window_12_vs_9.py
      - .github/workflows/test_short_term_rates_25_29_backward_window_12_vs_9.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python scripts/test_short_term_rates_25_29_backward_window_12_vs_9.py
      - name: Commit sensitivity results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/short_term_rates_25_29_backward_window_12_vs_9.json
          git add docs/data/short_term_rates_25_29_backward_window_12_vs_9_predictions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare 12 and 9 month backward windows"
          git pull --rebase origin main
          git push origin HEAD:main
